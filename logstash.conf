input {
  kafka {
    bootstrap_servers => "kafka:29092"
    topics => ["ecom.public.products"]
    codec => "json"
    auto_offset_reset => "earliest"
    group_id => "logstash-products-sync"
  }
}

filter {
  # Debezium bọc message trong object "payload"
  # Dạng: { "schema": {...}, "payload": { "before": ..., "after": ..., "op": "c/u/d" } }
  # Hoặc nếu không có schema thì nằm trực tiếp ở root. Ta kiểm tra cả 2:
  
  ruby {
    code => '
      payload = event.get("payload") || event.to_hash
      op = payload["op"]
      after_data = payload["after"]
      before_data = payload["before"]

      if op == "d"
        # Xóa document
        doc_id = before_data ? before_data["id"] : nil
        event.set("[@metadata][action]", "delete")
        event.set("[@metadata][doc_id]", doc_id.to_s) if doc_id
      elsif after_data
        # Tạo hoặc Cập nhật document
        event.set("[@metadata][action]", "index")
        event.set("[@metadata][doc_id]", after_data["id"].to_s)

        # Đưa các trường từ after_data ra root document
        after_data.each do |k, v|
          # Riêng price: Debezium encode DECIMAL thành base64 byte, ta bỏ qua hoặc parse float nếu cần
          # Các trường thông dụng: id, name, description, category, stock
          if k != "price"
            event.set(k, v)
          end
        end
      end
    '
  }

  mutate {
    remove_field => ["schema", "payload", "before", "after", "source", "op", "ts_ms", "transaction", "@version"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "products"
    action => "%{[@metadata][action]}"
    document_id => "%{[@metadata][doc_id]}"
  }

  stdout {
    codec => rubydebug
  }
}
